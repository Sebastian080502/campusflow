services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: campusflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: campusflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusflow -d campusflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - campusflow-db:/var/lib/postgresql/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    image: ${IMAGE}-api:${TAG}
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://campusflow:${POSTGRES_PASSWORD}@db:5432/campusflow?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    image: ${IMAGE}-api:${TAG}
    env_file: .env
    environment:
      NODE_ENV: production
      APP_ENV: production
      DATABASE_URL: postgresql://campusflow:${POSTGRES_PASSWORD}@db:5432/campusflow?schema=public
      PORT: 3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: ${IMAGE}-web:${TAG}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  campusflow-db:
