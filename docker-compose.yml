services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: campusflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: campusflow
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusflow -d campusflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - campusflow-db:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
      additional_contexts:
        openapi: ./docs/07-api/contracts/openapi
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://campusflow:${POSTGRES_PASSWORD}@db:5432/campusflow?schema=public
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      additional_contexts:
        openapi: ./docs/07-api/contracts/openapi
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://campusflow:${POSTGRES_PASSWORD}@db:5432/campusflow?schema=public
      PORT: 3000
      SEED_ON_START: ${SEED_ON_START:-false}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

  web:
    build: ./frontend
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  campusflow-db:
