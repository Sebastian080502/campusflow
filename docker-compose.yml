services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: campusflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: campusflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusflow -d campusflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - campusflow-db:/var/lib/postgresql/data

  api:
    build: ./backend
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgresql://campusflow:${POSTGRES_PASSWORD}@db:5432/campusflow?schema=public
      PORT: 3000
      SEED_ON_START: ${SEED_ON_START:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  campusflow-db:
